name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      # Not a secret: CI-only test key, used by the rate-limit/auth tests.
      JIRA_RAG_API_KEY: test-key-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests (no Postgres, GPU, or 27B)
        run: pytest -q -m "not local"
