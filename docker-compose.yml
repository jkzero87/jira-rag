# jira-rag: API only — the database is the shared de_postgres (single source),
# reached by container name on its external Docker network.
# The 27B llama-server runs on the host GPU and is reached as host.docker.internal.
# PG credentials and keys come from .env via env_file (see .env.example); no secrets here.
name: jira-rag

services:
  api:
    build: .
    image: ghcr.io/jkzero87/jira-rag-api:${API_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override PGHOST/PGPORT from .env: inside Docker the API reaches
      # de_postgres by its container name on that network, not via host ports.
      PGHOST: de_postgres
      PGPORT: "5432"
      LLAMA_SERVER_URL: http://host.docker.internal:8092/v1/chat/completions
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      JIRA_RAG_API_KEY: ${JIRA_RAG_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.hf:/models
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - de_postgres

networks:
  de_postgres:
    name: de-postgres_default
    external: true
